# 在 GitHub 的免费 macOS runner 上把 GlassNotify 编成**未签名**的 .ipa
#
# 思路同 CarNotify，但：
#  - 源码在仓库的 GlassNotify/ 子目录（与 CarNotify 并存，互不覆盖）
#  - 产物推到 glassnotify-build 分支（不与 carnotify-build 冲突）
#  - 版本号唯一来源是 GlassNotify/project.yml 的 MARKETING_VERSION
#  - 不打包 Pkg 网页资源（眼镜是原生 WS 客户端，不需要浏览器页面）
#
# 取产物（匿名、零代理）：
#  https://raw.githubusercontent.com/lathlee/carnovel/glassnotify-build/ci-logs/last-build.md
#  https://raw.githubusercontent.com/lathlee/carnovel/glassnotify-build/ci-logs/GlassNotify-<版本>-unsigned.ipa

name: Build GlassNotify IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'GlassNotify/**'
      - '.github/workflows/glassnotify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 读取版本号（唯一来源 project.yml）
        run: |
          VER=$(sed -n 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' GlassNotify/project.yml | head -1)
          if [ -z "$VER" ]; then
            echo "!! project.yml 里没找到 MARKETING_VERSION"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "本次构建版本: $VER"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: GlassNotify
        run: |
          xcodegen generate
          ls -d GlassNotify.xcodeproj
          xcodebuild -project GlassNotify.xcodeproj -list

      - name: 编译（不签名）
        id: build
        working-directory: GlassNotify
        run: |
          set -o pipefail
          xcodebuild build \
            -project GlassNotify.xcodeproj \
            -scheme GlassNotify \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -200

      - name: 校验 .app 产物
        if: steps.build.outcome == 'success'
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name 'GlassNotify.app' -type d | head -1)
          echo "APP=$APP"
          ls -l "$APP" | head -40
          if [ -f "$APP/Assets.car" ]; then
            echo "OK  Assets.car  $(stat -f%z "$APP/Assets.car") 字节"
          else
            echo "!! 缺少 Assets.car（图标资源没编进去，IPA 仍然打包；本步不再 exit 1）"
          fi

      - name: 打包成 .ipa
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name 'GlassNotify.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "没找到 GlassNotify.app，产物目录内容："
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 || true
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "GlassNotify-$VER-unsigned.ipa" Payload
          ls -lh "GlassNotify-$VER-unsigned.ipa"

      - name: 上传产物（保留 30 天）
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GlassNotify-${{ env.VER }}-unsigned-ipa
          path: ${{ runner.temp }}/GlassNotify-${{ env.VER }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 把日志与产物推到 glassnotify-build 分支
        if: always()
        run: |
          set +e
          mkdir -p ci-logs

          LOG="$RUNNER_TEMP/build.log"

          if [ -f "$LOG" ]; then
            grep -E "error:|fatal error:|BUILD FAILED|The following build commands failed" "$LOG" \
              | grep -v "^ *$" | sort -u > ci-logs/errors.txt
            echo "共 $(wc -l < ci-logs/errors.txt) 条错误/失败标记"
          else
            echo "(没有生成构建日志)" > ci-logs/errors.txt
          fi

          {
            echo "# GlassNotify 最后一次构建"
            echo
            echo "- 结果: **${{ steps.build.outcome }}**"
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## 错误摘要"
            echo
            echo '```'
            cat ci-logs/errors.txt
            echo '```'
            echo
            echo "## 完整日志（末尾 2500 行）"
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              tail -2500 "$LOG"
            else
              echo "(无)"
            fi
            echo '```'
          } > ci-logs/last-build.md

          if [ -f "$RUNNER_TEMP/GlassNotify-$VER-unsigned.ipa" ]; then
            cp "$RUNNER_TEMP/GlassNotify-$VER-unsigned.ipa" "ci-logs/GlassNotify-$VER-unsigned.ipa"
            echo "已附带 GlassNotify-$VER-unsigned.ipa ($(du -h "ci-logs/GlassNotify-$VER-unsigned.ipa" | cut -f1))"
          fi

          cp "GlassNotify/GlassNotify/Assets.xcassets/AppIcon.appiconset/icon-1024.png" "ci-logs/icon.png"
          IPA_SIZE=$(stat -f%z "ci-logs/GlassNotify-$VER-unsigned.ipa" 2>/dev/null || echo 0)
          RAW_BASE="https://raw.githubusercontent.com/lathlee/carnovel/glassnotify-build/ci-logs"
          IPA_SIZE="$IPA_SIZE" bash scripts/gen_sources.sh "$VER" "$RAW_BASE" "com.lath.glassnotify.sidestore.raw" "ci-logs/source.json"
          echo "已生成 ci-logs/source.json (raw 备选源)"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B glassnotify-build
          git add -f ci-logs/
          git commit -m "ci: GlassNotify 构建日志与产物 [skip ci]" || echo "内容无变化"
          git push -f origin glassnotify-build

      - name: 构建失败则让 job 失败
        if: steps.build.outcome != 'success'
        run: |
          echo "编译失败。日志见 glassnotify-build 分支的 ci-logs/last-build.md"
          exit 1
