# 在 GitHub 的免费 macOS runner 上把 Glass-view 编成**未签名**的 .ipa
#
# Glass-view 是**独立项目**（安卓眼镜的 iPhone 端）：
#   - 代码在 GlassView/ 目录，与 CarNotify（车机通知）/ GlassNotify 完全无关
#   - bundle id：com.lath.glassview（CarNotify 是 com.lath.carnotify）
#   - 产物分支：glassview-build（CarNotify 用 carnotify-build，互不覆盖）
#
# 产物怎么拿（仓库公开，日志/artifact 下载要认证，所以多做一步提交到分支）：
#   https://raw.githubusercontent.com/lathlee/carnovel/glassview-build/ci-logs/last-build.md
#   https://raw.githubusercontent.com/lathlee/carnovel/glassview-build/ci-logs/GlassView-<版本号>-unsigned.ipa
#
# IPA 文件名带版本号，版本号的唯一来源是 GlassView/project.yml 里的
# MARKETING_VERSION —— 第一步读出来写进 $GITHUB_ENV，后面所有步骤引用。

name: Build GlassView IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'GlassView/**'
      - '.github/workflows/glassview.yml'
  workflow_dispatch:

permissions:
  contents: write        # 需要它才能把日志推到 glassview-build 分支

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 读取版本号（唯一来源 project.yml）
        run: |
          VER=$(sed -n 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' GlassView/project.yml | head -1)
          if [ -z "$VER" ]; then
            echo "!! GlassView/project.yml 里没找到 MARKETING_VERSION"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "本次构建版本: $VER"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: GlassView
        run: |
          xcodegen generate
          ls -d GlassView.xcodeproj
          xcodebuild -project GlassView.xcodeproj -list

      - name: 跑协议自检（不依赖 Xcode，纯 Python）
        working-directory: GlassView
        # 这两个脚本把 NotifyServer.swift 的逻辑逐行搬到 Python，
        # 用真实字节流喂它：半包、粘包、mask、Content-Length 分片、握手 Accept。
        run: |
          set -o pipefail
          {
            python3 test_wsframe.py
            python3 test_http_state.py
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: 编译（不签名）
        id: build
        working-directory: GlassView
        run: |
          set -o pipefail
          xcodebuild build \
            -project GlassView.xcodeproj \
            -scheme GlassView \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -200

      - name: 校验产物与资源
        if: steps.build.outcome == 'success'
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name 'GlassView.app' -type d | head -1)
          echo "APP=$APP"
          echo "--- .app 根目录 ---"
          ls -l "$APP" | head -40
          for f in index.html rtos.wasm Assets.car; do
            if [ -f "$APP/$f" ]; then
              echo "OK  $f  $(stat -f%z "$APP/$f") 字节"
            else
              echo "!! 缺少 $f"
              exit 1
            fi
          done
          # bundle id 必须是 glassview —— 防止再跟 CarNotify 撞车导致覆盖安装
          PLIST="$APP/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          echo "bundle id: $BID"
          if [ "$BID" != "com.lath.glassview" ]; then
            echo "!! bundle id 不是 com.lath.glassview（当前：$BID），会覆盖安装别的 App"
            exit 1
          fi
          if [ -d "$APP/PlugIns/GlassViewWidget.appex" ]; then
            echo "OK  PlugIns/GlassViewWidget.appex"
          else
            echo "!! 缺少 PlugIns/GlassViewWidget.appex —— 小组件没被打包"
            exit 1
          fi

      - name: 打包成 .ipa
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name 'GlassView.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "没找到 GlassView.app，产物目录内容："
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 || true
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "GlassView-$VER-unsigned.ipa" Payload
          ls -lh "GlassView-$VER-unsigned.ipa"

      - name: 上传产物（保留 30 天）
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GlassView-${{ env.VER }}-unsigned-ipa
          path: ${{ runner.temp }}/GlassView-${{ env.VER }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 把日志与产物推到 glassview-build 分支
        if: always()
        run: |
          set +e
          mkdir -p ci-logs

          LOG="$RUNNER_TEMP/build.log"

          if [ -f "$LOG" ]; then
            grep -E "error:|fatal error:|BUILD FAILED|The following build commands failed" "$LOG" \
              | grep -v "^ *$" | sort -u > ci-logs/errors.txt
            echo "共 $(wc -l < ci-logs/errors.txt) 条错误/失败标记"
          else
            echo "(没有生成构建日志)" > ci-logs/errors.txt
          fi

          {
            echo "# GlassView 最后一次构建"
            echo
            echo "- 结果: **${{ steps.build.outcome }}**"
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## 错误摘要"
            echo
            echo '```'
            cat ci-logs/errors.txt
            echo '```'
            echo
            echo "## 协议自检（WsFrame / 状态机）"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/tests.log" ]; then
              cat "$RUNNER_TEMP/tests.log"
            else
              echo "(自检步骤没跑起来)"
            fi
            echo '```'
            echo
            echo "## 完整日志（末尾 2500 行）"
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              tail -2500 "$LOG"
            else
              echo "(无)"
            fi
            echo '```'
          } > ci-logs/last-build.md

          if [ -f "$RUNNER_TEMP/GlassView-$VER-unsigned.ipa" ]; then
            cp "$RUNNER_TEMP/GlassView-$VER-unsigned.ipa" "ci-logs/GlassView-$VER-unsigned.ipa"
            echo "已附带 GlassView-$VER-unsigned.ipa ($(du -h "ci-logs/GlassView-$VER-unsigned.ipa" | cut -f1))"
          fi

          # 图标 + raw 备选源（不开 GitHub Pages 也能用 SideStore 添加源）
          cp "GlassView/GlassView/Assets.xcassets/AppIcon.appiconset/icon-1024.png" "ci-logs/icon.png"
          IPA_SIZE=$(stat -f%z "ci-logs/GlassView-$VER-unsigned.ipa" 2>/dev/null || echo 0)
          RAW_BASE="https://raw.githubusercontent.com/lathlee/carnovel/glassview-build/ci-logs"
          IPA_SIZE="$IPA_SIZE" bash scripts/gen_sources_glassview.sh "$VER" "$RAW_BASE" "com.lath.glassview.sidestore.raw" "ci-logs/source.json"
          echo "已生成 ci-logs/source.json (raw 备选源)"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B glassview-build
          git add -f ci-logs/
          git commit -m "ci: GlassView 构建日志与产物 [skip ci]" || echo "内容无变化"
          git push -f origin glassview-build

      - name: 构建失败则让 job 失败
        if: steps.build.outcome != 'success'
        run: |
          echo "编译失败。日志见 glassview-build 分支的 ci-logs/last-build.md"
          exit 1
