# 在 GitHub 的免费 macOS runner 上把 CarNotify 编成**未签名**的 .ipa
#
# 本机是 Windows，编译器 Xcode 只有 macOS 有，所以走云端编译。
#
# 产物怎么拿：
#   仓库公开，但 job 日志 / artifact 下载都要认证。
#   所以这里多做一步 —— 把构建日志和 .ipa 提交到 carnotify-build 分支，
#   然后从 raw.githubusercontent.com 直接下，零认证、零代理依赖：
#     https://raw.githubusercontent.com/lathlee/carnovel/carnotify-build/ci-logs/last-build.md
#     https://raw.githubusercontent.com/lathlee/carnovel/carnotify-build/ci-logs/CarNotify.ipa
#
# 注意：故意跟 CarNovel 的 ci-logs 分支分开，两边各自 --force 推送，
#      互不覆盖。

name: Build CarNotify IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'CarNotify/**'
      - '.github/workflows/carnotify.yml'
  workflow_dispatch:

permissions:
  contents: write        # 需要它才能把日志推到 carnotify-build 分支

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          # 仓库默认分支是 ci-logs（CarNovel 那条线留下的），
          # 不显式指定的话可能检出错的内容。
          ref: ${{ github.sha }}

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: CarNotify
        run: |
          xcodegen generate
          ls -d CarNotify.xcodeproj
          xcodebuild -project CarNotify.xcodeproj -list

      - name: 编译（不签名）
        id: build
        working-directory: CarNotify
        # 编译失败要让 job 直接失败，日志由后面"保留日志"那步统一提交
        run: |
          set -o pipefail
          xcodebuild build \
            -project CarNotify.xcodeproj \
            -scheme CarNotify \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -200

      - name: 校验资源是否真的打进 .app
        if: steps.build.outcome == 'success'
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name 'CarNotify.app' -type d | head -1)
          echo "APP=$APP"
          echo "--- .app 根目录 ---"
          ls -l "$APP" | head -40
          for f in index.html rtos.wasm; do
            if [ -f "$APP/$f" ]; then
              echo "OK  $f  $(stat -f%z "$APP/$f") 字节"
            else
              echo "!! 缺少 $f —— 车机上的页面会加载不出来"
              exit 1
            fi
          done

      - name: 打包成 .ipa
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name 'CarNotify.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "没找到 CarNotify.app，产物目录内容："
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 || true
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry CarNotify.ipa Payload
          ls -lh CarNotify.ipa

      - name: 上传产物（保留 30 天）
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CarNotify-unsigned-ipa
          path: ${{ runner.temp }}/CarNotify.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 把日志与产物推到 carnotify-build 分支
        if: always()
        run: |
          set +e
          mkdir -p ci-logs

          {
            echo "# CarNotify 最后一次构建"
            echo
            echo "- 结果: **${{ steps.build.outcome }}**"
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/build.log" ]; then
              tail -600 "$RUNNER_TEMP/build.log"
            else
              echo "(没有生成构建日志)"
            fi
            echo '```'
          } > ci-logs/last-build.md

          if [ -f "$RUNNER_TEMP/CarNotify.ipa" ]; then
            cp "$RUNNER_TEMP/CarNotify.ipa" ci-logs/CarNotify.ipa
            echo "已附带 CarNotify.ipa ($(du -h ci-logs/CarNotify.ipa | cut -f1))"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B carnotify-build
          git add -f ci-logs/
          git commit -m "ci: CarNotify 构建日志与产物 [skip ci]" || echo "内容无变化"
          git push -f origin carnotify-build

      - name: 构建失败则让 job 失败
        if: steps.build.outcome != 'success'
        run: |
          echo "编译失败。日志见 carnotify-build 分支的 ci-logs/last-build.md"
          exit 1
