name: Android Server APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-server.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 构建 Debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CarNotifyServer-1.0-debug.apk
          ls -l out
          echo "=== badging ==="
          "$ANDROID_HOME"/build-tools/34.0.0/aapt dump badging out/CarNotifyServer-1.0-debug.apk | head -8 || true

      - name: 上传 artifact（备份）
        uses: actions/upload-artifact@v4
        with:
          name: CarNotifyServer-apk
          path: out/CarNotifyServer-1.0-debug.apk

      - name: 推到 android-build 分支
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B android-build
          git rm -rf . --quiet || true
          mkdir -p apk
          cp out/CarNotifyServer-1.0-debug.apk apk/
          printf "commit=%s\ntime=%s\n" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > apk/BUILD.txt
          cat apk/BUILD.txt
          git add apk
          git commit -m "build: CarNotifyServer apk from $GITHUB_SHA" || echo "no changes"
          git push -f origin android-build
