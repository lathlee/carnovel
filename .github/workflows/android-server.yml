name: Android Server APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-server.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（使用 runner 预装）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKM="$p"; break; fi
          done
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "=== platforms ==="; ls "$ANDROID_HOME/platforms" || true
          echo "=== build-tools ==="; ls "$ANDROID_HOME/build-tools" || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 构建 Debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CarNotifyServer-1.2-debug.apk
          ls -l out
          echo "=== badging ==="
          "$ANDROID_HOME"/build-tools/34.0.0/aapt dump badging out/CarNotifyServer-1.2-debug.apk | head -8 || true

      - name: 上传 artifact（备份）
        uses: actions/upload-artifact@v4
        with:
          name: CarNotifyServer-apk
          path: out/CarNotifyServer-1.2-debug.apk

      - name: 推到 android-build 分支
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B android-build
          git rm -rf . --quiet || true
          mkdir -p apk
          cp out/CarNotifyServer-1.2-debug.apk apk/
          printf "commit=%s\ntime=%s\n" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > apk/BUILD.txt
          cat apk/BUILD.txt
          git add apk
          git commit -m "build: CarNotifyServer apk from $GITHUB_SHA" || echo "no changes"
          git push -f origin android-build
