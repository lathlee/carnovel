# XcodeGen 工程描述
#
# 为什么要这个文件：本机是 Windows，没有 Xcode，也就没法手点出一个 .xcodeproj。
# XcodeGen 用这个 YAML 在 CI 上生成 Xcode 工程，于是「Windows 写码 → 云端编译」成立。
#
# 本地（有 Mac 时）：brew install xcodegen && xcodegen generate && open CarNovel.xcodeproj
# CI：见 .github/workflows/build-ipa.yml

name: CarNovel

options:
  bundleIdPrefix: com.lath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 侧载不需要 Apple 签名 —— 签名交给 SideStore / AltStore 用你的免费 Apple ID 做
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  CarNovel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: CarNovel
        excludes:
          - "Info.plist"      # 由 INFOPLIST_FILE 引用，不要当资源拷进去

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lath.carnovel
        PRODUCT_NAME: CarNovel
        INFOPLIST_FILE: CarNovel/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # 不引入任何 CarPlay 相关能力 —— 这是刻意的，见 Info.plist 顶部注释
