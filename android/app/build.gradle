plugins {
    id 'com.android.application' version '8.1.4'
}

android {
    namespace 'com.lath.carnotifyserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.lath.carnotifyserver"
        minSdk 19          // Android 4.4
        targetSdk 28
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // 轻量纯 Java HTTP 服务器，兼容 Android 4.4
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
