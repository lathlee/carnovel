# XcodeGen 工程描述 —— CarNotify
#
# 本机是 Windows，没有 Xcode，所以工程文件用 YAML 描述，
# 由 CI 上的 XcodeGen 生成 .xcodeproj。
#
# 本地（有 Mac 时）：brew install xcodegen && xcodegen generate

name: CarNotify

options:
  bundleIdPrefix: com.lath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 侧载不需要 Apple 签名 —— 签名交给 SideStore / AltStore 用免费 Apple ID 做
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

schemes:
  CarNotify:
    build:
      targets:
        CarNotify: all

targets:
  CarNotify:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # 逐个列出来，不写目录通配 ——
    # 这样哪些文件进哪个 build phase 一目了然，不会被 XcodeGen 的自动推断坑到。
    sources:
      - path: CarNotify/App
      - path: CarNotify/UI
      - path: CarNotify/NotifyServer.swift
      - path: CarNotify/BackgroundKeepAlive.swift
      # Pkg 里的 index.html + rtos.wasm 显式当资源。
      # 关键点：必须是 buildPhase: resources（逐个文件加进 Resources 阶段），
      # 不能用 folder reference —— 那会变成 .app/Pkg/index.html，
      # 而网页里写的是相对路径 fetch("rtos.wasm")。
      - path: CarNotify/Pkg
        buildPhase: resources
      # AppIcon.appiconset 所在的资源目录。XcodeGen 会自动把它编进 Assets.car，
      # 并在这里显式指定 AppIcon 名称，确保 iPhone 主屏能显示图标。
      - path: CarNotify/Assets.xcassets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lath.carnotify
        PRODUCT_NAME: CarNotify
        INFOPLIST_FILE: CarNotify/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 刻意不引入任何 CarPlay 能力 —— 车机屏由 APTV 的浏览器渲染
